name: Temporary private Kaggle CPU diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recipe-kaggle-cpu-diagnosis
  cancel-in-progress: false
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check -r kaggle-worker/requirements-launcher.txt
      - name: Launch private CPU diagnosis only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_KERNEL_OWNER: ${{ secrets.KAGGLE_KERNEL_OWNER }}
        run: python kaggle-worker/diagnose_launcher.py
